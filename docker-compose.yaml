
services:
  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  wildfly:
    build:
      context: ./wildfly
      dockerfile: Dockerfile
    container_name: wildfly-server
    ports:
      - "8080:8080"
      - "9990:9990"
      - "8787:8787"
    command:
      - /opt/jboss/wildfly/bin/standalone.sh
      - --debug
      - "0.0.0.0:8787"
      - -b
      - 0.0.0.0
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
